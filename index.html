<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement & Interview Tracker</title>
    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-main: #1e293b;
            --text-muted: #64748b;
            --border: #e2e8f0;
            --success: #10b981;
            --warning: #f59e0b;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 20px;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        header h1 {
            color: var(--primary);
            font-size: 2.5rem;
            margin-bottom: 5px;
        }

        header p {
            color: var(--text-muted);
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 2fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 24px;
            margin-bottom: 20px;
        }

        .card h2 {
            font-size: 1.25rem;
            margin-bottom: 20px;
            color: var(--text-main);
            border-bottom: 2px solid var(--border);
            padding-bottom: 10px;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            font-size: 0.875rem;
            font-weight: 600;
            margin-bottom: 5px;
            color: var(--text-main);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 0.95rem;
            outline: none;
            transition: border-color 0.2s;
        }

        .form-group input:focus, .form-group select:focus {
            border-color: var(--primary);
        }

        .btn {
            background-color: var(--primary);
            color: white;
            border: none;
            padding: 12px 20px;
            width: 100%;
            border-radius: 8px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: background-color 0.2s;
        }

        .btn:hover {
            background-color: var(--primary-hover);
        }

        .table-responsive {
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border);
            font-size: 0.9rem;
        }

        th {
            background-color: #f1f5f9;
            color: var(--text-main);
            font-weight: 600;
        }

        tr:hover {
            background-color: #f8fafc;
        }

        .badge {
            padding: 5px 10px;
            border-radius: 20px;
            font-size: 0.75rem;
            font-weight: 600;
            display: inline-block;
        }

        .badge-coding {
            background-color: #e0f2fe;
            color: #0369a1;
        }

        .badge-interview {
            background-color: #fef3c7;
            color: #92400e;
        }

        .badge-selected {
            background-color: #d1fae5;
            color: #065f46;
        }

        .delete-btn {
            background: #ef4444;
            color: white;
            border: none;
            padding: 6px 10px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.75rem;
        }

        .delete-btn:hover {
            background: #dc2626;
        }

        .empty-state {
            text-align: center;
            color: var(--text-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

    <div class="container">
        <header>
            <h1>Interview Schedule Tracker</h1>
            <p>Students ki coding aur interview rounds ki selection details track karein</p>
        </header>

        <div class="dashboard-grid">
            <!-- Form Section -->
            <div class="card">
                <h2>New Entry Add Karein</h2>
                <form id="trackerForm">
                    <div class="form-group">
                        <label for="studentName">Student ka Naam</label>
                        <input type="text" id="studentName" placeholder="Jaise: Rahul Sharma" required>
                    </div>

                    <div class="form-group">
                        <label for="companyName">Company ka Naam</label>
                        <input type="text" id="companyName" placeholder="Jaise: Google, TCS" required>
                    </div>

                    <div class="form-group">
                        <label for="roundType">Round Type</label>
                        <select id="roundType" required>
                            <option value="">Round Select Karein</option>
                            <option value="Coding Round">Coding Round</option>
                            <option value="Technical Interview">Technical Interview</option>
                            <option value="HR Interview">HR Interview</option>
                            <option value="Final Selection">Final Selection</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="interviewDate">Date & Time</label>
                        <input type="datetime-local" id="interviewDate" required>
                    </div>

                    <button type="submit" class="btn">Record Save Karein</button>
                </form>
            </div>

            <!-- Table Section -->
            <div class="card">
                <h2>Scheduled & Selected Students List</h2>
                <div class="table-responsive">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Naam</th>
                                <th>Company</th>
                                <th>Round</th>
                                <th>Date/Time</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody id="trackerTableBody">
                            <!-- Data dynamically yahan aayega -->
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // LocalStorage se data load karna ya empty array banana
        let trackers = JSON.parse(localStorage.getItem('interviewTrackers')) || [];

        const trackerForm = document.getElementById('trackerForm');
        const trackerTableBody = document.getElementById('trackerTableBody');

        function renderTable() {
            trackerTableBody.innerHTML = '';

            if (trackers.length === 0) {
                trackerTableBody.innerHTML = `<tr><td colspan="5" class="empty-state">Koi record available nahi hai.</td></tr>`;
                return;
            }

            trackers.forEach((item, index) => {
                let badgeClass = 'badge-coding';
                if (item.roundType.includes('Interview')) badgeClass = 'badge-interview';
                if (item.roundType.includes('Final')) badgeClass = 'badge-selected';

                const row = document.createElement('tr');
                row.innerHTML = `
                    <td><strong>${item.studentName}</strong></td>
                    <td>${item.companyName}</td>
                    <td><span class="badge ${badgeClass}">${item.roundType}</span></td>
                    <td>${formatDate(item.interviewDate)}</td>
                    <td><button class="delete-btn" onclick="deleteTracker(${index})">Delete</button></td>
                `;
                trackerTableBody.appendChild(row);
            });
        }

        function formatDate(dateString) {
            const options = { year: 'numeric', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit' };
            return new Date(dateString).toLocaleDateString('en-IN', options);
        }

        trackerForm.addEventListener('submit', function(e) {
            e.preventDefault();

            const studentName = document.getElementById('studentName').value;
            const companyName = document.getElementById('companyName').value;
            const roundType = document.getElementById('roundType').value;
            const interviewDate = document.getElementById('interviewDate').value;

            const newEntry = {
                studentName,
                companyName,
                roundType,
                interviewDate
            };

            trackers.push(newEntry);
            localStorage.setItem('interviewTrackers', JSON.stringify(trackers));

            renderTable();
            trackerForm.reset();
        });

        function deleteTracker(index) {
            trackers.splice(index, 1);
            localStorage.setItem('interviewTrackers', JSON.stringify(trackers));
            renderTable();
        }

        // Initial render
        renderTable();
    </script>
</body>
</html>
