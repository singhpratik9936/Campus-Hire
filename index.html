<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interview Schedule Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 min-h-screen p-6">
    <div class="max-w-6xl mx-auto">
        <!-- Header -->
        <header class="mb-8 text-center">
            <h1 class="text-3xl font-bold text-gray-800">Interview Schedule Tracker</h1>
            <p class="text-gray-600 mt-2">Students ke coding aur interview rounds ka selection track karein</p>
        </header>

        <!-- Main Container -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Form Section -->
            <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-1">
                <h2 class="text-xl font-semibold text-gray-700 mb-4">Naya Entry Add Karein</h2>
                <form id="trackerForm" class="space-y-4">
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Student ka Naam</label>
                        <input type="text" id="studentName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Jaise: Rahul Sharma">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Company ka Naam</label>
                        <input type="text" id="companyName" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" placeholder="Jaise: Google, TCS">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Round Type</label>
                        <select id="roundType" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Coding Round">Coding Round</option>
                            <option value="Technical Interview">Technical Interview</option>
                            <option value="HR Interview">HR Interview</option>
                            <option value="Final Selection">Final Selection</option>
                        </select>
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Interview/Round Date</label>
                        <input type="date" id="interviewDate" required class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                    <div>
                        <label class="block text-sm font-medium text-gray-600 mb-1">Status</label>
                        <select id="status" class="w-full px-3 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="Selected">Selected</option>
                            <option value="Pending">Pending</option>
                            <option value="Rejected">Rejected</option>
                        </select>
                    </div>
                    <button type="submit" class="w-full bg-blue-600 text-white py-2 rounded-lg font-semibold hover:bg-blue-700 transition duration-200">Record Save Karein</button>
                </form>
            </div>

            <!-- Table Section -->
            <div class="bg-white p-6 rounded-xl shadow-md lg:col-span-2 overflow-x-auto">
                <div class="flex justify-between items-center mb-4">
                    <h2 class="text-xl font-semibold text-gray-700">Tracked Interviews</h2>
                    <span id="totalCount" class="text-sm bg-blue-100 text-blue-800 px-3 py-1 rounded-full font-medium">Total: 0</span>
                </div>
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-gray-100 text-gray-600 text-sm">
                            <th class="p-3">Student</th>
                            <th class="p-3">Company</th>
                            <th class="p-3">Round</th>
                            <th class="p-3">Date</th>
                            <th class="p-3">Status</th>
                            <th class="p-3 text-center">Action</th>
                        </tr>
                    </thead>
                    <tbody id="trackerTableBody" class="divide-y divide-gray-200 text-sm">
                        <!-- Dynamic Rows Here -->
                    </tbody>
                </table>
                <div id="emptyState" class="text-center py-8 text-gray-400">
                    Abhi tak koi data add nahi kiya gaya hai.
                </div>
            </div>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const form = document.getElementById('trackerForm');
            const tableBody = document.getElementById('trackerTableBody');
            const totalCount = document.getElementById('totalCount');
            const emptyState = document.getElementById('emptyState');

            let records = JSON.parse(localStorage.getItem('interviewRecords')) || [];

            function renderTable() {
                tableBody.innerHTML = '';
                totalCount.textContent = `Total: ${records.length}`;

                if (records.length === 0) {
                    emptyState.style.display = 'block';
                    return;
                } else {
                    emptyState.style.display = 'none';
                }

                records.forEach((record, index) => {
                    let statusBadge = '';
                    if (record.status === 'Selected') {
                        statusBadge = '<span class="bg-green-100 text-green-700 px-2.5 py-1 rounded-full text-xs font-semibold">Selected</span>';
                    } else if (record.status === 'Pending') {
                        statusBadge = '<span class="bg-yellow-100 text-yellow-700 px-2.5 py-1 rounded-full text-xs font-semibold">Pending</span>';
                    } else {
                        statusBadge = '<span class="bg-red-100 text-red-700 px-2.5 py-1 rounded-full text-xs font-semibold">Rejected</span>';
                    }

                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td class="p-3 font-medium text-gray-800">${record.studentName}</td>
                        <td class="p-3 text-gray-600">${record.companyName}</td>
                        <td class="p-3 text-gray-600">${record.roundType}</td>
                        <td class="p-3 text-gray-600">${record.interviewDate}</td>
                        <td class="p-3">${statusBadge}</td>
                        <td class="p-3 text-center">
                            <button onclick="deleteRecord(${index})" class="text-red-500 hover:text-red-700 font-medium">Delete</button>
                        </td>
                    `;
                    tableBody.appendChild(row);
                });
            }

            form.addEventListener('submit', (e) => {
                e.preventDefault();
                const newRecord = {
                    studentName: document.getElementById('studentName').value,
                    companyName: document.getElementById('companyName').value,
                    roundType: document.getElementById('roundType').value,
                    interviewDate: document.getElementById('interviewDate').value,
                    status: document.getElementById('status').value
                };

                records.push(newRecord);
                localStorage.setItem('interviewRecords', JSON.stringify(records));
                form.reset();
                renderTable();
            });

            window.deleteRecord = function(index) {
                records.splice(index, 1);
                localStorage.setItem('interviewRecords', JSON.stringify(records));
                renderTable();
            }

            renderTable();
        });
    </script>
</body>
</html>
